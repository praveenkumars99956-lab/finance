
[functions.create-agent]
enabled = true
verify_jwt = false
import_map = "./functions/create-agent/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-agent/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-agent/*.html" ]

[functions.create-admin-workspace]
enabled = true
verify_jwt = false
import_map = "./functions/create-admin-workspace/deno.json"
entrypoint = "./functions/create-admin-workspace/index.ts"
