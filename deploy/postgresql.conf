# ============================================================================
# Finance Suite — PostgreSQL tuning for concurrent, ACID financial workloads
# ----------------------------------------------------------------------------
# Apply to the primary database (Supabase Postgres, RDS, Cloud SQL, or the
# self-hosted instance). Values assume an 8 vCPU / 16 GB RAM primary with
# synchronous streaming replication. Scale the memory settings proportionally.
#
#   shared_buffers        ≈ 25% of RAM
#   effective_cache_size  ≈ 60–75% of RAM
#   maintenance_work_mem  ≈ 5% of RAM (cap at 2 GB)
# ============================================================================

# --- Connections -----------------------------------------------------------
# Keep direct connections low and put PgBouncer in front. Every app node needs
# only a small pool; Postgres pays for every backend process.
max_connections = 400
superuser_reserved_connections = 10
reserved_connections = 10

# --- Memory ----------------------------------------------------------------
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# --- Write-ahead log / durability -----------------------------------------
wal_level = replica
wal_compression = on
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ACID: never acknowledge a commit before the WAL record is flushed.
synchronous_commit = on
# With a synchronous standby, require at least one replica acknowledgement.
# Set synchronous_standby_names to your replica(s) before enabling this line.
# synchronous_standby_names = 'ANY 1 (*)'
wal_writer_delay = 10ms
commit_delay = 0

# --- Concurrency / consistency --------------------------------------------
# Read Committed is the default for OLTP. Money-moving RPCs must either run at
# SERIALIZABLE or take public.finance_lock_workspace(), which serialises all
# writes for a workspace across every node.
default_transaction_isolation = 'read committed'
deadlock_timeout = 1s

# A hung transaction holds locks and blocks the queue — fail fast.
statement_timeout = '30s'
lock_timeout = '10s'
idle_in_transaction_session_timeout = '15s'
idle_session_timeout = '10min'

# --- Planner / parallelism -------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Autovacuum — keeps index bloat (and read latency) flat ---------------
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Logical decoding / replicas ------------------------------------------
max_replication_slots = 20
max_wal_senders = 20
# Increase only if you use two-phase commit in application transactions.
max_prepared_transactions = 200

# --- Timeouts / logging ----------------------------------------------------
log_min_duration_statement = '500ms'
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = '10s'
track_io_timing = on
