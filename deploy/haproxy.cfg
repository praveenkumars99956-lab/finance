# ============================================================================
# HAProxy — sticky-session gateway for the Finance Suite web tier
# ============================================================================

global
  log stdout format raw local0
  maxconn 20000
  tune.ssl.default-dh-param 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option forwardfor
  option http-server-close
  retries 3
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 15s
  timeout http-keep-alive 15s

frontend http_front
  bind *:80
  # Sticky sessions: HAProxy pins a browser to one app node for the life of the
  # cookie. Supabase JWTs are stateless, so stickiness is defence-in-depth for
  # any node-local cache, signed cookie or websocket state.
  acl is_api path_beg /api
  use_backend api_nodes if is_api
  default_backend web_nodes

backend web_nodes
  balance roundrobin
  cookie SERVERID insert indirect nocache httponly samesite=lax
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 5s fall 3 rise 2

  server web1 web1:80 check cookie s1
  server web2 web2:80 check cookie s2
  # Add more replicas here:
  # server web3 web3:80 check cookie s3

# The API is stateless: any replica can verify the same JWT, so no stickiness
# and no shared session store are required.
backend api_nodes
  balance roundrobin
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 5s fall 3 rise 2

  server api1 api1:4000 check
  server api2 api2:4000 check
  # Add more API replicas here:
  # server api3 api3:4000 check

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 10s
  stats admin if LOCALHOST
