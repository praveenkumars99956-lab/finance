# ============================================================================
# Finance Suite — Redis cache configuration
# Shared read-through cache and rate-limit store for all app nodes.
# Auth is supplied on the command line via REDIS_PASSWORD.
# ============================================================================

bind 0.0.0.0
protected-mode yes
port 6379

tcp-backlog 511
tcp-keepalive 60
timeout 0

# Cache workload: evict least-recently-used keys, never block writes.
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence is optional for a pure cache. Keep AOF off to avoid disk stalls;
# the Postgres workspace_cache_versions table is the source of truth for
# coherence. Enable AOF only if Redis also stores rate-limit counters that
# must survive a restart.
appendonly no
save ""

# Fast, non-blocking expiry sweep
hz 20
dynamic-hz yes

# Slow query visibility
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Reject writes when out of memory instead of crashing
stop-writes-on-bgsave-error no
