<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="web_dashboard" name="shell-type" />
    <meta name="theme-color" content="#351078" />
    <meta name="description" content="Finance Suite — loan, collection and settlement management for lending teams." />
    <title>Finance Suite - Institutional Core</title>
    <script>
      // Apply the saved theme before styles load so dark mode never flashes light.
      try {
        var savedTheme = window.localStorage.getItem('finance-theme')
        if (savedTheme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (error) {
        // Storage can be blocked; React still applies the in-memory theme.
      }
    </script>
    <style>
      /* Critical pre-bundle token: the full dark stylesheet loads with the app. */
      :root[data-theme='dark'] body { background-color: #0b0714; color: #f7f4ff; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
          background-color: #F2ECFF;
          color: #1A0A3B;
          font-family: 'Inter', sans-serif;
        }
        #root {
          min-height: 100vh;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': '#351078',
              'primary-light': '#6B3FA0',
              'primary-container': '#5B2D8E',
              'on-primary': '#FFFFFF',
              'on-primary-container': '#EAD9FF',
              'secondary': '#7C4DBC',
              'surface': '#F2ECFF',
              'surface-container-lowest': '#FFFFFF',
              'surface-container-low': '#F8F4FF',
              'surface-container': '#EDE5FF',
              'surface-container-high': '#E4D9FF',
              'surface-container-highest': '#D9CCFF',
              'on-surface': '#1A0A3B',
              'on-surface-variant': '#4A3870',
              'outline': '#7B6BA0',
              'outline-variant': '#C8BBDF',
              'error': '#B00020',
              'error-container': '#FFD6DE',
              'background': '#F2ECFF',
              'on-background': '#1A0A3B',
              'on-error': '#ffffff',
              'on-error-container': '#93000a',
              'inverse-surface': '#2A1050',
              'inverse-on-surface': '#F2ECFF'
            },
            borderRadius: {
              DEFAULT: '1rem',
              lg: '2rem',
              xl: '3rem',
              full: '9999px'
            },
            spacing: {
              'space-lg': '1.5rem',
              gutter: '1rem',
              'space-sm': '0.5rem',
              'space-xl': '2rem',
              'margin-desktop': '2rem',
              'space-md': '1rem',
              'gutter-desktop': '1.5rem',
              'margin-tablet': '1.5rem',
              margin: '1rem',
              'space-xs': '0.25rem'
            },
            fontFamily: {
              'body-lg': ['Inter', 'sans-serif'],
              'headline-xl-mobile': ['Inter', 'sans-serif'],
              'label-md': ['Inter', 'sans-serif'],
              'headline-sm': ['Inter', 'sans-serif'],
              'body-sm': ['Inter', 'sans-serif'],
              'label-lg': ['Inter', 'sans-serif'],
              'headline-xl': ['Inter', 'sans-serif'],
              'body-md': ['Inter', 'sans-serif'],
              'headline-lg': ['Inter', 'sans-serif'],
              'headline-lg-mobile': ['Inter', 'sans-serif'],
              'data-metric': ['Inter', 'sans-serif'],
              'label-sm': ['Inter', 'sans-serif'],
              'headline-md': ['Inter', 'sans-serif']
            },
            fontSize: {
              'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'headline-xl-mobile': ['28px', { lineHeight: '34px', letterSpacing: '-0.015em', fontWeight: '700' }],
              'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' }],
              'headline-sm': ['16px', { lineHeight: '24px', fontWeight: '600' }],
              'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }],
              'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }],
              'headline-xl': ['36px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '700' }],
              'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
              'headline-lg': ['28px', { lineHeight: '36px', letterSpacing: '-0.015em', fontWeight: '600' }],
              'headline-lg-mobile': ['22px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }],
              'data-metric': ['24px', { lineHeight: '28px', letterSpacing: '-0.02em', fontWeight: '700' }],
              'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.03em', fontWeight: '500' }],
              'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }]
            }
          }
        }
      }
    </script>
  </head>

  <body class="bg-surface font-body-md text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
