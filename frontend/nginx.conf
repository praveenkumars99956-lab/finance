# Finance Suite — static SPA server
# One origin per replica; HAProxy in front owns sticky routing.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Compression for text assets
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;

  # Liveness probe used by HAProxy / compose
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Immutable, content-hashed build output
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the HTML shell so deployments roll forward instantly
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires off;
  }

  # SPA routing: unknown paths render the React router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-lived caching for static brand assets
  location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
